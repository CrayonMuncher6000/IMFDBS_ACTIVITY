<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - IMFDBS</title>
  <link rel="stylesheet" href="../Css/Dashboard.css">
</head>

<body>
  <nav>
    <div class="dropdown">
      <button class="dropbtn">Admin</button>
      <div class="dropdown-content">
        <a href="Dashboard.html">Dashboard</a>
        <a href="applicationlist.html">Applications</a>
        <a href="admindashboard.html">Admin Dashboard</a>
        <a href="register.html">Register</a>
        <a href="LogIn.html">Login</a>
      </div>
    </div>
    <div class="dropdown">
      <button class="dropbtn">Scholar</button>
      <div class="dropdown-content">
        <a href="ScholarList.html">Scholar List</a>
      </div>
    </div>
  </nav>
<div class="profile-box">
  <img src="path/to/profile-pic.jpg" alt="Profile Picture" class="profile-pic">
  <div class="profile-info">
    <p><strong>Name:</strong> John Doe</p>
    <p><strong>Email:</strong> johndoe@email.com</p>
    <p><strong>Program:</strong> BS Computer Science</p>
  </div>
  <button class="edit-profile-btn">Edit Profile</button>
  <button class="apply-btn" onclick="window.location.href='application.html'">Apply for Scholarship</button>
</div>
<!-- Edit Profile Modal -->
<div id="editProfileModal" class="modal">
  <div class="modal-content">
    <span class="close" id="closeModalBtn">&times;</span>
    <h2>Edit Profile</h2>
    <form id="editProfileForm">
      <input type="text" id="editName" name="name" placeholder="Name" required>
      <input type="email" id="editEmail" name="email" placeholder="Email" required>
      <input type="text" id="editProgram" name="program" placeholder="Program" required>
      <!-- Add more fields as needed -->
      <button type="submit">Save Changes</button>
    </form>
  </div>
</div>
<!-- ...existing HTML... -->

<!-- Place this just before </body> -->
<script>
  // Load profile from localStorage on page load
  window.addEventListener('DOMContentLoaded', function() {
    const savedProfile = JSON.parse(localStorage.getItem('profileData'));
    if (savedProfile) {
      document.querySelector('.profile-info p:nth-child(1)').innerHTML = `<strong>Name:</strong> ${savedProfile.name}`;
      document.querySelector('.profile-info p:nth-child(2)').innerHTML = `<strong>Email:</strong> ${savedProfile.email}`;
      document.querySelector('.profile-info p:nth-child(3)').innerHTML = `<strong>Program:</strong> ${savedProfile.program}`;
    }
  });

  // Open modal
  document.querySelector('.edit-profile-btn').onclick = function() {
    document.getElementById('editProfileModal').style.display = 'block';
    // Pre-fill modal fields with current profile info
    document.getElementById('editName').value = document.querySelector('.profile-info p:nth-child(1)').textContent.replace('Name:', '').trim();
    document.getElementById('editEmail').value = document.querySelector('.profile-info p:nth-child(2)').textContent.replace('Email:', '').trim();
    document.getElementById('editProgram').value = document.querySelector('.profile-info p:nth-child(3)').textContent.replace('Program:', '').trim();
  };
  // Close modal
  document.getElementById('closeModalBtn').onclick = function() {
    document.getElementById('editProfileModal').style.display = 'none';
  };
  // Close modal when clicking outside modal content
  window.onclick = function(event) {
    if (event.target == document.getElementById('editProfileModal')) {
      document.getElementById('editProfileModal').style.display = 'none';
    }
  };
  // Handle form submission (replace with your backend logic)
  document.getElementById('editProfileForm').onsubmit = function(e) {
    e.preventDefault();
    // Get new values
    const newName = document.getElementById('editName').value;
    const newEmail = document.getElementById('editEmail').value;
    const newProgram = document.getElementById('editProgram').value;
    // Update profile info on the page
    document.querySelector('.profile-info p:nth-child(1)').innerHTML = `<strong>Name:</strong> ${newName}`;
    document.querySelector('.profile-info p:nth-child(2)').innerHTML = `<strong>Email:</strong> ${newEmail}`;
    document.querySelector('.profile-info p:nth-child(3)').innerHTML = `<strong>Program:</strong> ${newProgram}`;
    // Save updated profile to localStorage
    const profileData = {
      name: newName,
      email: newEmail,
      program: newProgram
    };
    localStorage.setItem('profileData', JSON.stringify(profileData));
    // Close modal
    document.getElementById('editProfileModal').style.display = 'none';
  };
</script>
</body>
</html>
