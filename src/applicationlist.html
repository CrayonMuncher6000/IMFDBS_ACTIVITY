<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Applications - IMFDBS</title>
  <link rel="stylesheet" href="../Css/Login.css">
  <link rel="stylesheet" href="../Css/register.css">
  <link rel="stylesheet" href="../Css/applicationlist.css">
</head>
<body>
  <nav>
    <div class="dropdown">
      <button class="dropbtn">Admin</button>
      <div class="dropdown-content">
        <a href="Dashboard.html">Dashboard</a>
        <a href="applicationlist.html">Applications</a>
        <a href="admindashboard.html">Admin Dashboard</a>
        <a href="register.html">Register</a>
        <a href="LogIn.html">Login</a>
      </div>
    </div>
    <div class="dropdown">
      <button class="dropbtn">Scholar</button>
      <div class="dropdown-content">
        <a href="ScholarList.html">Scholar List</a>
      </div>
    </div>
  </nav>
  <h1 class="login">Pending Applications</h1>
  <div class="form-box">
    <table id="applicationTable" class="styled-table">
      <thead>
        <tr>
          <th>Student ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Program</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <!-- Applications will be loaded here -->
      </tbody>
    </table>
  </div>
  <script>
    async function loadApplications() {
      const tbody = document.querySelector('#applicationTable tbody');
      tbody.innerHTML = '';
      try {
        const res = await fetch('/api/scholarships');
        const data = await res.json();
        const pending = data.filter(app => app.status === 'Pending');
        if (pending.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5">No pending applications.</td></tr>';
        } else {
          pending.forEach(app => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td>${app.student_id}</td>
              <td>${app.name}</td>
              <td>${app.email || ''}</td>
              <td>${app.program}</td>
              <td>${app.status}</td>
            `;
            tbody.appendChild(tr);
          });
        }
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="5">Failed to load applications.</td></tr>';
      }
    }
    loadApplications();
  </script>
</body>
</html>
