<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scholarship Application</title>
  <link rel="stylesheet" href="../Css/application.css">
</head>
<body>
  <div class="application-title-wrapper">
  <h1 class="application-title">Scholarship Application</h1>
</div>
  <form class="application-form" id="applicationForm" action="#" method="post" enctype="multipart/form-data">
    <div class="form-box">
      <input type="text" name="fullname" placeholder="Full Name" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="text" name="program" placeholder="Program" required>
      <label for="documents">Upload Documents (PDF, DOCX, JPG, PNG):</label>
      <input type="file" id="documents" name="documents" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" multiple required>
      <button type="submit">Submit Application</button>
    </div>
  </form>
  <script>
    document.getElementById('applicationForm').onsubmit = async function(e) {
      e.preventDefault();
      const form = e.target;
      const formData = new FormData(form);
      // Build the payload for the backend
      const payload = {
        name: formData.get('fullname'),
        program: formData.get('program'),
        status: 'Pending', // or another default status
        email: formData.get('email') // if your backend expects email
      };
      try {
        const response = await fetch('/api/scholarships', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });
        if (response.ok) {
          window.location.href = 'Dashboard.html';
        } else {
          alert('Failed to submit application.');
        }
      } catch (err) {
        alert('Error submitting application.');
      }
    };
  </script>
</body>
</html>
