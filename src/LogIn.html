<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - IMFDBS</title>
  <link rel="stylesheet" href="../Css/Login.css">
</head>
<body>
  <nav>
    <div class="dropdown">
      <button class="dropbtn">Admin</button>
      <div class="dropdown-content">
        <a href="Dashboard.html">Dashboard</a>
        <a href="applicationlist.html">Applications</a>
        <a href="admindashboard.html">Admin Dashboard</a>
        <a href="register.html">Register</a>
        <a href="LogIn.html">Login</a>
      </div>
    </div>
    <div class="dropdown">
      <button class="dropbtn">Scholar</button>
      <div class="dropdown-content">
        <a href="ScholarList.html">Scholar List</a>
      </div>
    </div>
  </nav>
  
  <h1 class="login">Scholarship Tracker</h1>
<form id="loginForm">
  <div class="form-box">
    <input type="text" id="username" name="username" placeholder="Username" required>
    <input type="password" id="password" name="password" placeholder="Password" required>
    <button type="submit">Login</button>
    <a class="register-box" href="register.html">Don't have an account yet?</a>
    <div id="loginMessage" style="margin-top:10px;"></div>
  </div>
</form>
<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const messageDiv = document.getElementById('loginMessage');
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (res.ok) {
      messageDiv.style.color = 'green';
      messageDiv.textContent = 'Login successful! Redirecting...';
      setTimeout(() => window.location.href = 'Dashboard.html', 1500);
    } else {
      messageDiv.style.color = 'red';
      messageDiv.textContent = data.message || 'Login failed.';
    }
  } catch (err) {
    messageDiv.style.color = 'red';
    messageDiv.textContent = 'An error occurred.';
  }
});
</script>
</body>
</html>
