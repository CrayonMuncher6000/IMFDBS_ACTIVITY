<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scholars - IMFDBS</title>
  <link rel="stylesheet" href="Style.css">
</head>
<body>
  <nav>
    <div class="dropdown">
      <button class="dropbtn">Admin</button>
      <div class="dropdown-content">
        <a href="Dashboard.html">Dashboard</a>
        <a href="applicationlist.html">Applications</a>
        <a href="admindashboard.html">Admin Dashboard</a>
        <a href="register.html">Register</a>
        <a href="LogIn.html">Login</a>
      </div>
    </div>
    <div class="dropdown">
      <button class="dropbtn">Scholar</button>
      <div class="dropdown-content">
        <a href="ScholarList.html">Scholar List</a>
      </div>
    </div>
  </nav>
  <h1>Scholar List</h1>
  <form id="scholarshipForm">
    <input type="text" id="name" placeholder="Name" required>
    <input type="text" id="program" placeholder="Program" required>
    <input type="text" id="status" placeholder="Status" required>
    <button type="submit">Add Scholarship</button>
  </form>
  <table id="scholarshipTable" border="1" style="margin-top:20px;">
    <thead>
      <tr>
        <th>Name</th>
        <th>Program</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <!-- Scholarships will be loaded here -->
    </tbody>
  </table>
  <script src="scholarship.js"></script>
  <script>
    async function loadScholarships() {
      const tbody = document.querySelector('#scholarshipTable tbody');
      tbody.innerHTML = '';
      try {
        const scholarships = await getScholarships();
        scholarships.forEach(s => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${s.name}</td>
            <td>${s.program}</td>
            <td>${s.status}</td>
            <td>
              <button onclick="deleteScholar('${s._id}')">Delete</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="4">Failed to load scholarships</td></tr>';
      }
    }
    async function deleteScholar(id) {
      if (confirm('Delete this scholarship?')) {
        await deleteScholarship(id);
        loadScholarships();
      }
    }
    document.getElementById('scholarshipForm').onsubmit = async function(e) {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const program = document.getElementById('program').value;
      const status = document.getElementById('status').value;
      await addScholarship({ name, program, status });
      this.reset();
      loadScholarships();
    };
    loadScholarships();
  </script>
</body>
</html>
